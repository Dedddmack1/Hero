<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>H.E.R.O. HR Services | Helping Every Role Optimize</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
:root{
  --gold:#C8961A;
  --gold-lt:#E8B84B;
  --gold-pale:#F5E8C0;
  --navy:#0F1F35;
  --navy-mid:#1B3050;
  --navy-lt:#243d5e;
  --cream:#F7F2E8;
  --cream-dk:#EDE5D4;
  --text:#1A1A1A;
  --muted:#666;
  --white:#fff;
  --fd:'Cormorant Garamond',serif;
  --fb:'Outfit',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1)
}

*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0
}

html{
  scroll-behavior:smooth
}

body{
  font-family:var(--fb);
  background:var(--cream);
  color:var(--text);
  overflow-x:hidden
}

a{
  text-decoration:none
}

button{
  cursor:pointer
}

/* =========================
   NAVIGATION
========================= */

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:999;
  height:70px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(15,31,53,.97);
  border-bottom:1px solid rgba(200,150,26,.2);
  backdrop-filter:blur(12px)
}

.nb{
  display:flex;
  flex-direction:column;
  gap:1px;
  cursor:pointer
}

.nb-h{
  font-family:var(--fd);
  font-size:21px;
  font-weight:700;
  color:var(--gold);
  letter-spacing:5px;
  line-height:1
}

.nb-s{
  font-size:7px;
  font-weight:500;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,255,255,.35)
}

.nl{
  display:flex;
  gap:30px;
  list-style:none
}

.nl button{
  background:none;
  border:none;
  font-family:var(--fb);
  font-size:11px;
  font-weight:500;
  letter-spacing:2px;
  text-transform:uppercase;
  color:rgba(255,255,255,.6);
  padding-bottom:4px;
  position:relative;
  transition:color .3s var(--ease)
}

.nl button::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  width:0;
  height:1px;
  background:var(--gold);
  transition:width .3s var(--ease)
}

.nl button:hover,
.nl button.active{
  color:var(--gold)
}

.nl button:hover::after,
.nl button.active::after{
  width:100%
}

.n-cta{
  background:var(--gold);
  color:var(--navy);
  border:none;
  font-family:var(--fb);
  font-size:11px;
  font-weight:600;
  letter-spacing:2px;
  text-transform:uppercase;
  padding:10px 22px;
  border-radius:2px;
  transition:background .3s var(--ease)
}

.n-cta:hover{
  background:var(--gold-lt)
}

/* =========================
   PAGE SYSTEM
========================= */

.pg{
  display:none;
  padding-top:70px;
  min-height:100vh;
  animation:pgIn .4s var(--ease)
}

.pg.on{
  display:block
}

@keyframes pgIn{
  from{
    opacity:0;
    transform:translateY(10px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

/* =========================
   GENERAL
========================= */

.eb{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:10px;
  font-weight:600;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:14px
}

.eb-line{
  width:26px;
  height:1px;
  background:var(--gold);
  flex-shrink:0
}

.sh2{
  font-family:var(--fd);
  font-size:clamp(30px,3vw,44px);
  font-weight:700;
  line-height:1.1;
  margin-bottom:16px
}

.sh2-dk{
  color:var(--navy)
}

.sh2-lt{
  color:var(--white)
}

.sh2 em{
  color:var(--gold);
  font-style:italic
}

.sp{
  font-size:15px;
  font-weight:300;
  line-height:1.85;
  color:var(--muted)
}

.sp-lt{
  color:rgba(255,255,255,.6)
}

.sec{
  padding:96px 8%
}

.sec-dk{
  background:var(--navy)
}

.sec-cr{
  background:var(--cream)
}

.sec-wh{
  background:var(--white)
}

/* =========================
   BUTTONS
========================= */

.btn-g{
  background:var(--gold);
  color:var(--navy);
  border:none;
  font-family:var(--fb);
  font-size:11px;
  font-weight:600;
  letter-spacing:2px;
  text-transform:uppercase;
  padding:14px 28px;
  border-radius:2px;
  transition:all .3s var(--ease);
  display:inline-block
}

.btn-g:hover{
  background:var(--gold-lt);
  transform:translateY(-2px)
}

.btn-o{
  background:transparent;
  color:rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.2);
  font-family:var(--fb);
  font-size:11px;
  font-weight:500;
  letter-spacing:2px;
  text-transform:uppercase;
  padding:13px 28px;
  border-radius:2px;
  transition:all .3s var(--ease);
  display:inline-block
}

.btn-o:hover{
  border-color:var(--gold);
  color:var(--gold)
}

/* =========================
   HERO
========================= */

.hero{
  min-height:calc(100vh - 70px);
  background:var(--navy);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center
}

.hero-bg{
  position:absolute;
  inset:0;
  opacity:.035;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 48px,
      rgba(200,150,26,1) 48px,
      rgba(200,150,26,1) 49px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 48px,
      rgba(200,150,26,1) 48px,
      rgba(200,150,26,1) 49px
    )
}

.hero-glow{
  position:absolute;
  bottom:-200px;
  right:-100px;
  width:700px;
  height:700px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(200,150,26,.07) 0%,
    transparent 70%
  );
  pointer-events:none
}

.hero-inner{
  position:relative;
  z-index:2;
  padding:80px 10%;
  max-width:900px
}

.hero-tag{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:10px;
  font-weight:600;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:32px
}

.hero
